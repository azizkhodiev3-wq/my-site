    sellerAmountSpan.innerText = f(s);
    commissionSpan.innerText = f(c);
    buyerPaymentSpan.innerText = f(b);
    calcMetaSpan.innerText = '10% от ' + f(s) + ' = ' + f(c) + ' комиссии.';
  }

  };
  const letters = ['Б','В','Д','Ж','З','Л','О','У','Ф','Х','Ц','Ч','Ш','Щ','Э','Ю','Я'];

  function formatDate(d) {
    const dt = new Date(d);
    return String(dt.getDate()).padStart(2,'0') + '.' + String(dt.getMonth()+1).padStart(2,'0') + '.' + dt.getFullYear();
  }

  function initData() {
    const savedVersion = localStorage.getItem(STORAGE_VERSION);
    if (savedVersion !== CURRENT_VERSION) {
      localStorage.setItem(STORAGE_REVIEWS, JSON.stringify(defaultReviews));
      const userMap = {};
      defaultReviews.forEach(r => {
        if (!userMap[r.userId]) {
          let sn = fixedSurnames[r.userId] || (letters[Math.floor(Math.random()*letters.length)] + '.');
          userMap[r.userId] = { id: r.userId, name: r.userId, surname: sn, password: '', avatarColor: getRandomColor(), registered: r.date, reviewCount: 0 };
        }
        if (r.date < userMap[r.userId].registered) userMap[r.userId].registered = r.date;
      });
      const users = Object.values(userMap);
      users.forEach(u => { u.reviewCount = defaultReviews.filter(r => r.userId === u.id && r.approved).length; });
      localStorage.setItem(STORAGE_USERS, JSON.stringify(users));
      localStorage.setItem(STORAGE_VERSION, CURRENT_VERSION);
    }
    const sessionData = localStorage.getItem(STORAGE_SESSION);
    if (sessionData) { try { currentUser = JSON.parse(sessionData); } catch(e) { currentUser = null; } }
  }

  const getUsers = () => { try { return JSON.parse(localStorage.getItem(STORAGE_USERS)) || []; } catch(e) { return []; } };
  const saveUsers = (u) => localStorage.setItem(STORAGE_USERS, JSON.stringify(u));
  const getReviews = () => { try { return JSON.parse(localStorage.getItem(STORAGE_REVIEWS)) || []; } catch(e) { return []; } };
  const saveReviews = (r) => localStorage.setItem(STORAGE_REVIEWS, JSON.stringify(r));
  const getApprovedReviews = () => getReviews().filter(r => r.approved === true);
  const getPendingReviews = () => getReviews().filter(r => r.approved !== true);
  const getUserById = (id) => getUsers().find(u => u.id === id);

  function registerUser(name, surname, password) {
    const users = getUsers();
    const userId = name.trim();
    if (password.length < 4) return { success: false, message: 'Пароль минимум 4 символа.' };
    if (users.find(u => u.id === userId)) return { success: false, message: 'Такой пользователь уже есть.' };
    const newUser = { id: userId, name: userId, surname: surname.trim().toUpperCase() + '.', password, avatarColor: getRandomColor(), registered: formatDate(new Date()), reviewCount: 0 };
    users.push(newUser);
    saveUsers(users);
    currentUser = newUser;
    localStorage.setItem(STORAGE_SESSION, JSON.stringify(currentUser));
    return { success: true, user: newUser };
  }

  function loginUser(name, password) {
    const user = getUsers().find(u => u.id === name && u.password === password);
    if (!user) return { success: false, message: 'Неверное имя или пароль.' };
    currentUser = user;
    localStorage.setItem(STORAGE_SESSION, JSON.stringify(currentUser));
    return { success: true, user };
  }

  function logoutUser() {
    currentUser = null;
    localStorage.removeItem(STORAGE_SESSION);
    updateUserDisplay();
    document.getElementById('reviewModal').classList.remove('active');
  }

  function updateUserDisplay() {
    const userInfo = document.getElementById('userInfo');
    const reviewContainer = document.getElementById('reviewFormContainer');
    const authTabs = document.getElementById('authTabs');
    const registerForm = document.getElementById('registerForm');
    const loginForm = document.getElementById('loginForm');
    if (currentUser) {
      const color = currentUser.avatarColor || '#6b7280';
      const initial = currentUser.name.charAt(0).toUpperCase();
      const dn = currentUser.name + ' ' + currentUser.surname;
      userInfo.innerHTML = '<div class="user-badge"><div class="avatar-small" style="background-color:'+color+';">'+initial+'</div><span>'+dn+'</span><button id="logoutBtn" style="padding:4px 14px; font-size:0.8rem; border:1px solid #ef4444; color:#ef4444; background:transparent; border-radius:30px; cursor:pointer;">Выйти</button></div>';
      document.getElementById('logoutBtn').addEventListener('click', () => { if (confirm('Выйти?')) logoutUser(); });
      authTabs.style.display = 'none';
      registerForm.classList.add('hidden');
      loginForm.classList.add('hidden');
      reviewContainer.style.display = 'block';
      document.getElementById('reviewUserDisplay').textContent = 'Пользователь: ' + dn;
      document.getElementById('reviewModalTitle').textContent = '✍️ Оставить отзыв';
    } else {
      userInfo.innerHTML = '<span style="color: var(--text-muted);">Вы не авторизованы. Нажмите "Добавить отзыв" для входа.</span>';
      reviewContainer.style.display = 'none';
      document.getElementById('reviewModalTitle').textContent = '🔐 Вход или регистрация';
      authTabs.style.display = 'flex';
      registerForm.classList.add('hidden');
      loginForm.classList.remove('hidden');
      document.querySelectorAll('.auth-tabs button').forEach(t => t.classList.remove('active'));
      document.querySelector('.auth-tabs button[data-tab="login"]').classList.add('active');
    }
  }

  function addReview(text, stars) {
    if (!currentUser) return false;
    const reviews = getReviews();
    reviews.push({ id: Date.now(), userId: currentUser.id, text: text.trim(), stars: parseInt(stars) || 5, date: formatDate(new Date()), approved: false });
    saveReviews(reviews);
    let users = getUsers();
    const idx = users.findIndex(u => u.id === currentUser.id);
    if (idx !== -1) {
      const count = reviews.filter(r => r.userId === currentUser.id && r.approved).length;
      users[idx].reviewCount = count;
      saveUsers(users);
    }
    renderAll();
    return true;
  }

  function approveReview(id) {
    let reviews = getReviews();
    const idx = reviews.findIndex(r => r.id === id);
    if (idx !== -1) { reviews[idx].approved = true; saveReviews(reviews); renderAll(); }
  }

  function rejectReview(id) {
    let reviews = getReviews().filter(r => r.id !== id);
    saveReviews(reviews);
    renderAll();
  }

  // НА ГЛАВНОЙ — ТОЛЬКО СВЕЖИЕ ОТЗЫВЫ ЗА 14.09.2026
  function renderReviews() {
    const displayReviews = getApprovedReviews().filter(r => r.date === '14.09.2026');
    const grid = document.getElementById('reviewsGrid');
    grid.innerHTML = '';
    if (!displayReviews.length) {
      grid.innerHTML = '<p class="text-center" style="color: var(--text-muted); grid-column: 1/-1;">Пока нет отзывов.</p>';
      return;
    }
    displayReviews.forEach(review => {
      const user = getUserById(review.userId);
      const color = user ? user.avatarColor : '#6b7280';
      const initial = review.userId.charAt(0).toUpperCase();
      const stars = '★'.repeat(review.stars) + '☆'.repeat(5 - review.stars);
      const dn = user ? (user.name + ' ' + user.surname) : review.userId;
      const card = document.createElement('div');
      card.className = 'review-card';
      card.innerHTML = '<div class="review-header" data-userid="'+review.userId+'"><div class="review-avatar" style="background-color:'+color+';">'+initial+'</div><div class="review-name-date"><span class="review-name">'+dn+'</span><span class="review-date">'+review.date+'</span></div></div><div class="review-stars">'+stars+'</div><div class="review-text">'+review.text+'</div>';
      card.querySelector('.review-header').addEventListener('click', () => openProfile(review.userId));
      grid.appendChild(card);
    });
  }

  function renderModeration() {
    const pending = getPendingReviews();
    const container = document.getElementById('moderationList');
    if (!pending.length) { container.innerHTML = '<p style="color: var(--text-muted); text-align:center; padding:20px;">Нет отзывов на модерацию.</p>'; return; }
    container.innerHTML = '';
    pending.forEach(r => {
      const div = document.createElement('div');
      div.className = 'moderation-item';
      div.innerHTML = '<div><strong>'+r.userId+'</strong> ('+r.date+')</div><div>Оценка: '+'★'.repeat(r.stars)+'</div><div style="color:#cbd5e1; margin-top:6px;">'+r.text+'</div><div class="mod-actions"><button class="btn-approve" data-id="'+r.id+'">✅ Одобрить</button><button class="btn-reject" data-id="'+r.id+'">❌ Отклонить</button></div>';
      container.appendChild(div);
    });
    container.querySelectorAll('.btn-approve').forEach(b => b.addEventListener('click', () => approveReview(parseInt(b.dataset.id))));
    container.querySelectorAll('.btn-reject').forEach(b => b.addEventListener('click', () => { if (confirm('Удалить?')) rejectReview(parseInt(b.dataset.id)); }));

  function renderAll() { renderReviews(); updateUserDisplay(); if (document.getElementById('moderationModal').classList.contains('active')) renderModeration(); }

  // В ПРОФИЛЕ — ВСЕ ОТЗЫВЫ КЛИЕНТА (и старые, и новые)
  function openProfile(userId) {
    const user = getUserById(userId);
    if (!user) return;
    const all = getApprovedReviews().filter(r => r.userId === userId)
      .sort((a,b) => {
        const pa = a.date.split('.').reverse().join('');
        const pb = b.date.split('.').reverse().join('');
        return pb.localeCompare(pa);
      });
    const modal = document.getElementById('profileModal');
    const content = document.getElementById('profileContent');
    const initial = user.name.charAt(0).toUpperCase();
    let html = '<div class="profile-header"><div class="profile-avatar-large" style="background-color:'+user.avatarColor+';">'+initial+'</div><div class="profile-info"><h4>'+user.name+' '+user.surname+'</h4><div class="sub">На сайте с '+user.registered+'</div><div class="sub">Всего отзывов: '+all.length+'</div></div></div><div class="profile-reviews"><h5>История сделок ('+all.length+')</h5>';
    if (!all.length) html += '<p style="color: var(--text-muted);">Нет отзывов.</p>';
    else all.forEach(r => {
      html += '<div class="review-item"><div class="stars">'+'★'.repeat(r.stars)+'</div><div class="text">'+r.text+'</div><div style="font-size:0.75rem; color:#5b7aa5;">'+r.date+'</div></div>';
    });
    html += '</div>';
    content.innerHTML = html;
    modal.classList.add('active');
  }

  const registerForm = document.getElementById('registerForm');
  const loginForm = document.getElementById('loginForm');

  document.querySelectorAll('.auth-tabs button').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.auth-tabs button').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      if (tab.dataset.tab === 'register') { registerForm.classList.remove('hidden'); loginForm.classList.add('hidden'); }
      else { registerForm.classList.add('hidden'); loginForm.classList.remove('hidden'); }
    });
  });

  document.getElementById('registerBtn').addEventListener('click', () => {
    const n = document.getElementById('regName').value.trim();
    const s = document.getElementById('regSurname').value.trim();
    const p = document.getElementById('regPassword').value;
    if (!n) return alert('Введите имя.');
    if (!s) return alert('Введите букву фамилии.');
    if (s.length !== 1) return alert('Только одна буква.');
    if (p.length < 4) return alert('Пароль минимум 4 символа.');
    const res = registerUser(n, s, p);
    if (res.success) {
      document.getElementById('regName').value = '';
      document.getElementById('regSurname').value = '';
      document.getElementById('regPassword').value = '';
      updateUserDisplay();
      formContainer.style.display = 'block';
      document.getElementById('reviewUserDisplay').textContent = 'Пользователь: ' + res.user.name + ' ' + res.user.surname;
      successContainer.style.display = 'none';
      document.getElementById('reviewModalTitle').textContent = '✍️ Оставить отзыв';
    } else alert(res.message);
  });

  document.getElementById('loginBtn').addEventListener('click', () => {
    const n = document.getElementById('loginName').value.trim();
    const p = document.getElementById('loginPassword').value;
    if (!n || !p) return alert('Заполните поля.');
    const res = loginUser(n, p);
    if (res.success) {
      document.getElementById('loginName').value = '';
      document.getElementById('loginPassword').value = '';
      updateUserDisplay();
      formContainer.style.display = 'block';
      document.getElementById('reviewUserDisplay').textContent = 'Пользователь: ' + res.user.name + ' ' + res.user.surname;
      successContainer.style.display = 'none';
      document.getElementById('reviewModalTitle').textContent = '✍️ Оставить отзыв';
    } else alert(res.message);
  });

    formContainer.style.display = 'none';
    successContainer.style.display = 'none';
    document.getElementById('reviewText').value = '';

      formContainer.style.display = 'block';
      document.getElementById('reviewUserDisplay').textContent = 'Пользователь: ' + currentUser.name + ' ' + currentUser.surname;

      registerForm.classList.add('hidden');
      loginForm.classList.add('hidden');

      authTabs.style.display = 'flex';

  document.getElementById('submitReviewBtn').addEventListener('click', () => {
    if (!currentUser) return alert('Войдите в систему.');
    const text = document.getElementById('reviewText').value.trim();
    const starsEl = document.querySelector('input[name="stars"]:checked');
    const stars = starsEl ? parseInt(starsEl.value) : 5;
    if (!text) return alert('Напишите отзыв.');
    formContainer.style.display = 'none';
    successContainer.style.display = 'none';
    const existing = document.getElementById('reviewLoadingPlaceholder');
    if (existing) existing.remove();
    const loaderDiv = document.createElement('div');
    loaderDiv.id = 'reviewLoadingPlaceholder';
    loaderDiv.innerHTML = '<div style="text-align:center; padding:20px;"><div class="spinner"></div><p style="color:#cbd5e1;">Отправка отзыва на модерацию...</p></div>';
    document.getElementById('reviewModalTitle').after(loaderDiv);
    addReview(text, stars);
    setTimeout(() => {
      const l = document.getElementById('reviewLoadingPlaceholder');
      if (l) l.remove();
      successContainer.style.display = 'block';
      setTimeout(() => {
        reviewModal.classList.remove('active');
        successContainer.style.display = 'none';
        formContainer.style.display = 'block';
        document.getElementById('reviewText').value = '';
        document.querySelectorAll('input[name="stars"]').forEach(el => el.checked = false);
      }, 2000);
    }, 3000);
  });

  window.addEventListener('click', (e) => { if (e.target === document.getElementById('profileModal')) document.getElementById('profileModal').classList.remove('active'); });

  document.getElementById('moderatorLoginBtn').addEventListener('click', () => {
    if (moderPassInput.value.trim() === 'admin123') {
      passwordModal.classList.remove('active');
      moderationModal.classList.add('active');
      renderModeration();
    } else { alert('Неверный пароль!'); moderPassInput.value = ''; moderPassInput.focus(); }
  });
  moderPassInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('moderatorLoginBtn').click(); });
  document.getElementById('stat20000').addEventListener('dblclick', (e) => { e.stopPropagation(); passwordModal.classList.add('active'); moderPassInput.value = ''; moderPassInput.focus(); });
  document.getElementById('footer').addEventListener('dblclick', (e) => { e.stopPropagation(); passwordModal.classList.add('active'); moderPassInput.value = ''; moderPassInput.focus(); });

  // FAQ
  const faqs = [
    { q: 'Какие сделки вы проводите?', a: 'Любые: фриланс, криптовалюта, недвижимость, техника, аккаунты, домены, авто, карго.' },
    { q: 'Почему 10%?', a: 'Оптимальная ставка за полную безопасность и оперативное решение споров.' },
    { q: 'Как быстро вы отвечаете?', a: 'Всегда на связи, обычно ответ в течение пары минут.' },
    { q: 'Безопасно ли?', a: 'Да, средства удерживаются до полного выполнения условий.' },

    { q: 'Работаете ли с другими странами?', a: 'Да, работаю со всем СНГ и дальним зарубежьем.' },
    { q: 'Какая минимальная сумма?', a: 'Минимальной суммы нет, комиссия всегда 10%.' },
    { q: 'Сколько времени занимает сделка?', a: 'От 15 минут до нескольких часов.' },
    { q: 'Как с вами связаться?', a: 'Только через ВК: vk.me/news_fedorov.' },
    { q: 'Почему вам можно доверять?', a: '20 000+ сделок, 100% положительных отзывов.' },
    { q: 'Что такое эскроу?', a: 'Гарант удерживает средства до выполнения условий сделки.' },
    { q: 'Как работает арбитраж?', a: 'Изучаю доказательства от обеих сторон и принимаю решение.' },
    { q: 'Мои данные в безопасности?', a: 'Да, полная конфиденциальность.' },
    { q: 'Какие способы оплаты?', a: 'Карты, переводы, криптовалюта, наличные.' },
    { q: 'Что если продавец не отвечает?', a: 'Возвращаю деньги покупателю через 48 часов.' },
    { q: 'Работаете с юрлицами?', a: 'Да, заключаю договоры с компаниями и ИП.' },
    { q: 'Анонимные сделки возможны?', a: 'Да, полная анонимность по желанию клиента.' },
    { q: 'Как проверить вашу репутацию?', a: 'Открытая статистика, 20 000+ отзывов в ВК.' },
    { q: 'В какое время лучше писать?', a: 'В любое, я работаю 24/7.' },
    { q: 'Есть ли скидки для постоянных?', a: 'Да, индивидуальные условия.' }
  ];
  const faqGrid = document.getElementById('faqGrid');
  faqs.forEach(f => { faqGrid.innerHTML += '<div class="faq-card"><h4><i class="fas fa-question-circle" style="color: var(--accent);"></i> '+f.q+'</h4><p>'+f.a+'</p></div>'; });

  // КЕЙСЫ
  const cases = [
    { title: 'Криптообмен 2.5 млн ₽', desc: 'Сделка закрыта за 2 часа. Комиссия 250 000 ₽.' },
    { title: 'Спор по фрилансу', desc: 'Арбитраж в пользу исполнителя. Выплачено 120 000 ₽.' },
    { title: 'Покупка квартиры', desc: 'Сделка на 8 млн ₽ через эскроу. Комиссия 800 000 ₽.' },
    { title: 'Обмен крипты', desc: 'Анонимная сделка на 450 000 ₽.' },
    { title: 'Возврат предоплаты', desc: 'Деньги возвращены за 1 день.' },
    { title: 'Карго-доставка', desc: 'Гарант удержал оплату до получения на складе.' },
    { title: 'Продажа аккаунта', desc: 'Сделка на 1.2 млн ₽. Полная безопасность.' },
    { title: 'Обмен USDT', desc: '100 000 USDT за 3 часа.' },
    { title: 'Спор по недвижимости', desc: 'Соглашение через арбитраж за 2 дня.' },
    { title: 'Международный контракт', desc: 'Сделка на 5 млн ₽ с Европой.' },
    { title: 'Продажа домена', desc: 'Домен за 900 000 ₽.' },
    { title: 'Спор по крипте', desc: 'Арбитраж показал обратное.' },
    { title: 'Авто из-за рубежа', desc: 'Сделка на 3.2 млн ₽.' },

    { title: 'Обмен валюты', desc: 'Лучший курс и безопасность.' }
  ];
  const casesGrid = document.getElementById('casesGrid');
  const colors = ['#3b82f6','#f59e0b','#10b981','#8b5cf6','#ef4444','#06b6d4','#f472b6','#f97316','#14b8a6','#a78bfa','#34d399','#fbbf24','#60a5fa','#fb923c','#e879f9'];
  cases.forEach((c, i) => {
    casesGrid.innerHTML += '<div class="card"><h3><i class="fas fa-folder-open" style="color:'+colors[i % colors.length]+'; margin-right: 8px;"></i> Кейс #'+(i+1)+': '+c.title+'</h3><p class="small-note">'+c.desc+'</p></div>';
  });

  // АНИМАЦИЯ ПОЯВЛЕНИЯ
  const sections = document.querySelectorAll('.section');
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.style.opacity = '1';
        entry.target.style.transform = 'translateY(0px)';
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.1 });
  sections.forEach(sec => {
    sec.style.opacity = '0';
    sec.style.transform = 'translateY(20px)';
    sec.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
    observer.observe(sec);
  });

  initData();
  renderAll();
  console.log('✅ На главной — только 14.09.2026. Старые отзывы — только в профиле. Пароль модерации: admin123');
